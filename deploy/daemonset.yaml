apiVersion: v1
kind: ServiceAccount
metadata: {name: steady-image-cache, namespace: kube-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: steady-image-cache, namespace: kube-system}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: steady-image-cache, namespace: kube-system}
subjects:
- kind: ServiceAccount
  name: steady-image-cache
  namespace: kube-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: steady-image-cache}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: steady-image-cache, namespace: kube-system}
spec:
  selector:
    matchLabels: {app: steady-image-cache}
  template:
    metadata:
      labels: {app: steady-image-cache}
    spec:
      serviceAccountName: steady-image-cache
      hostNetwork: true
      containers:
      - name: sic
        image: steady-image-cache:dev
        imagePullPolicy: IfNotPresent
        securityContext: {runAsUser: 0, readOnlyRootFilesystem: true}
        ports:
        - {name: registry, containerPort: 5000, hostPort: 5000}
        env:
        - {name: SIC_LISTEN, value: "0.0.0.0:5000"}
        - {name: SIC_KUBERNETES_DISCOVERY, value: "true"}
        - {name: SIC_POD_LABEL_SELECTOR, value: "app=steady-image-cache"}
        - {name: SIC_PEER_PORT, value: "5000"}
        - {name: SIC_UPSTREAM_ENABLED, value: "false"}
        # Only used when upstream fallback is enabled; e.g. "docker.io,ghcr.io".
        - {name: SIC_UPSTREAM_REGISTRIES, value: ""}
        # Plain-HTTP health/metrics on loopback: kubelet cannot present the client
        # certificate the main listener requires.
        - {name: SIC_ADMIN_LISTEN, value: "127.0.0.1:5001"}
        - {name: SIC_CONTAINERD_IMPORT, value: "true"}
        - {name: SIC_CONTAINERD_ADDRESS, value: "/run/containerd/containerd.sock"}
        - {name: SIC_CONTAINERD_NAMESPACE, value: "k8s.io"}
        - {name: SIC_TLS_CERT, value: "/tls/tls.crt"}
        - {name: SIC_TLS_KEY, value: "/tls/tls.key"}
        - {name: SIC_TLS_CA, value: "/tls/ca.crt"}
        - {name: SIC_TLS_CLIENT_CERT, value: "/tls/tls.crt"}
        - {name: SIC_TLS_CLIENT_KEY, value: "/tls/tls.key"}
        - {name: SIC_TLS_SERVER_NAME, value: "steady-image-cache"}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: HOST_IP
          valueFrom: {fieldRef: {fieldPath: status.hostIP}}
        volumeMounts:
        - {name: cache, mountPath: /var/lib/steady-image-cache}
        - {name: containerd-socket, mountPath: /run/containerd/containerd.sock, readOnly: true}
        - {name: tls, mountPath: /tls, readOnly: true}
        readinessProbe: {httpGet: {scheme: HTTP, host: 127.0.0.1, path: /healthz, port: 5001}, initialDelaySeconds: 2, periodSeconds: 10}
      volumes:
      - name: cache
        hostPath: {path: /var/lib/steady-image-cache, type: DirectoryOrCreate}
      - name: containerd-socket
        hostPath: {path: /run/containerd/containerd.sock, type: Socket}
      - name: tls
        secret: {secretName: steady-image-cache-tls}
