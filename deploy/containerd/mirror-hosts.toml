# Install as /etc/containerd/certs.d/<registry>/hosts.toml on each node, one
# directory per registry you want cached (docker.io, ghcr.io, registry.example.com).
# For docker.io the server below is registry-1.docker.io; for any other registry
# it is that registry's own address.
#
# SIC is a mirror here, not the only host: containerd tries it first and goes on
# to the registry itself when SIC does not answer (it is down, restarting or being
# upgraded) or does not have the content. A node whose SIC pod is gone therefore
# still pulls, SIC's own image included, and an upgrade of SIC cannot lock the
# node out of the registry that holds the new image.
#
# Use deploy/containerd/hosts.toml (SIC as the only host) instead when no registry
# can be reached from the nodes except through the peers, such as an air-gapped
# cluster with no internal registry.
#
# Tags: the capabilities below are "pull" only, on purpose. containerd then asks
# the registry itself which digest a tag names, and fetches the manifest and the
# layers by digest from SIC, so a tag that has moved is never answered from an
# old cached or imported alias. Add "resolve" only if SIC has upstream fallback
# enabled for this registry (SIC_UPSTREAM_ENABLED=true and the registry in
# SIC_UPSTREAM_REGISTRIES): SIC then confirms tags against the registry after
# SIC_TAG_TTL. Without upstream, SIC cannot check a tag and would serve what it
# has indefinitely.
#
# To have SIC fetch and cache what no node has yet, enable upstream fallback for
# the registry as above. Without it, a miss is a 404 and containerd takes the
# content from the registry directly, which is not cached.
server = "https://registry-1.docker.io"

# Trust for the fallback registry itself. The "ca" under the SIC host below
# applies to SIC only, so a registry with a private CA that is not in the node's
# system roots needs its own entry here, or the fallback fails TLS verification.
# ca = "/etc/containerd/certs.d/registry.example.com/ca.crt"

[host."https://127.0.0.1:5000"]
  capabilities = ["pull"]
  ca = "/etc/steady-image-cache/ca.crt"
  # containerd's own client certificate, for the mutual TLS that SIC requires: a
  # client-only pair from the same CA as SIC's certificate (README, "TLS"), put on
  # the node by your provisioning. Do not copy the DaemonSet's tls.key here: that
  # is the server key of the SIC pod, and a copy readable on the node widens what
  # its exposure costs.
  client = [["/etc/steady-image-cache/tls.crt", "/etc/steady-image-cache/tls.key"]]
