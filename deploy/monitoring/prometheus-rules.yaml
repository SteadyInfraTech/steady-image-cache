apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: steady-image-cache-rules
  namespace: kube-system
  labels:
    role: alert-rules
    app: steady-image-cache
spec:
  groups:
  - name: steady-image-cache.alerts
    rules:
    - alert: SteadyImageCacheDiskFull
      expr: increase(sic_disk_full_total[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Steady Image Cache disk reserve reached on {{ $labels.instance }}"
        description: "Node {{ $labels.instance }} is refusing downloads because disk free space has reached SIC_MIN_FREE_BYTES / SIC_MIN_FREE_PERCENT reserve."

    - alert: SteadyImageCacheCorruptBlobsDetected
      expr: increase(sic_corrupt_blobs_total[10m]) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Corrupt OCI blobs detected in cache on {{ $labels.instance }}"
        description: "Background scrubber or store verification found corrupt blobs on node {{ $labels.instance }}. Check node filesystem or disk health."

    - alert: SteadyImageCacheHighStoreErrors
      expr: rate(sic_store_errors_total[5m]) > 0.05
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "High storage I/O error rate on {{ $labels.instance }}"
        description: "Node {{ $labels.instance }} is failing to write or read from its cache directory."

    - alert: SteadyImageCacheHighVerifyErrors
      expr: rate(sic_verify_errors_total[5m]) > 0.1
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "High digest verification errors on {{ $labels.instance }}"
        description: "Peers or upstream registries are delivering content that does not match declared digests."

    - alert: SteadyImageCacheCoordinatorDegraded
      expr: rate(sic_coordinator_fallbacks_total[10m]) > rate(sic_coordinator_hits_total[10m])
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High coordinator fallback rate on {{ $labels.instance }}"
        description: "Node {{ $labels.instance }} is consistently falling back to direct pulls because coordinators are slow or unreachable."

    - alert: SteadyImageCacheNoPeersDiscovered
      expr: sic_peers == 0 and on() (count(sic_peers) > 1)
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} sees zero peer caches"
        description: "Pod peer discovery is finding 0 ready peers despite other nodes running in the cluster."
