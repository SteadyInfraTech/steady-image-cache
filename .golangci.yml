version: "2"

run:
  tests: false

linters:
  default: none
  enable:
    - bodyclose   # every http.Response body is closed, on every path
    - noctx       # no HTTP request without a context
    - gosec       # insecure permissions, weak randomness for security, ...
    - errorlint   # errors are wrapped with %w and compared with errors.Is/As
    - errcheck
    - govet
    - staticcheck
  settings:
    errcheck:
      exclude-functions:
        # Closing something that was only read from, or removing a temporary
        # file on the way out, has no error worth handling.
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        # Writing to an http.ResponseWriter: the client has gone if it fails.
        - fmt.Fprintf(net/http.ResponseWriter)
    staticcheck:
      checks:
        - all
        - -QF1002   # a tagged switch would not read better where cases mix tests
        # golangci-lint's own default exclusions for style checks:
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gosec:
      excludes:
        # Conversions between int64/uint64 of sizes and counters that are bounded
        # by the file system; checked where a value could really be out of range.
        - G115
        # File names are built from validated digests and from configuration, never
        # from request input; see store.ValidDigest.
        - G304
        # Unhandled errors are errcheck's job, with its exclusions spelled out above.
        - G104
        # Matches the name of the service account token file, not a credential.
        - G101
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
