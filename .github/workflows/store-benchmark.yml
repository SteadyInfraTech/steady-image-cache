name: Store read benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/store/**"
      - ".github/workflows/store-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Benchmark verified and unverified reads
        run: go test ./internal/store -run '^$' -bench '^BenchmarkOpenRead$' -benchmem -benchtime=1s
