name: Store read benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/store/**"
      - ".github/workflows/store-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Benchmark verified and unverified reads
        run: go test ./internal/store -run '^$' -bench '^BenchmarkOpenRead$' -benchmem -benchtime=1s
