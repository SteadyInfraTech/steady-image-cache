name: Build and publish image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # The image for every architecture it is published for, built on pull
  # requests as well: the publish job below only runs after a merge, and a
  # Dockerfile mistake for one architecture should not wait until then.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build for all platforms, without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=ci
          cache-from: type=gha

  build-and-publish:
    needs: [test, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # Keyless signing: the signature is made with a short-lived certificate that
      # Sigstore issues for this workflow's GitHub identity, so there is no key to
      # keep or to leak.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # A software bill of materials and the build's provenance, per
          # platform, as attestations inside the image index: the one signature
          # below, on the index, covers them too.
          sbom: true
          provenance: mode=max
          # Nodes are not all amd64. The Dockerfile cross-compiles, so no
          # emulation is needed.
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # Signed by digest, so every tag that points at it is covered, and a tag
      # moved later is not. The verification right after is the same command the
      # README gives users, with this workflow's own identity: a signature that
      # cannot be verified fails the release instead of being found later.
      - name: Sign the image and verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          test -n "$DIGEST" || { echo "the build gave no digest" >&2; exit 1; }
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            "$IMAGE@$DIGEST" > /dev/null
          echo "signed and verified: $IMAGE@$DIGEST"

      - name: Check the attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # An SBOM for each platform the image is published for, naming packages.
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .SBOM }}' > sbom.json
          for p in linux/amd64 linux/arm64; do
            jq -e --arg p "$p" '.[$p].SPDX.packages | length > 0' sbom.json > /dev/null \
              || { echo "no SBOM with packages for $p" >&2; exit 1; }
          done
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .Provenance }}' \
            | jq -e 'length > 0' > /dev/null \
            || { echo "no provenance" >&2; exit 1; }
          echo "SBOM and provenance present for both platforms"
