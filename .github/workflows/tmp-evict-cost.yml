name: tmp-evict-cost
on:
  workflow_dispatch:
  push:
    branches: [perf/evict-index]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: SIC_EVICT_COST=1 go test ./internal/store -run TestEvictScanCost -v -count=1 | grep -E 'EVICT|PASS|FAIL|ok'
