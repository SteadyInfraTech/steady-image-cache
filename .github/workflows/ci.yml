name: CI

# Static checks, race-detector tests, a short fuzz run and a vulnerability scan on
# every change. Tools are built from source at a pinned version, as in e2e.yml,
# so they do not change under us.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # gofumpt, bodyclose, noctx, gosec, errorlint, errcheck, govet and
      # staticcheck; see .golangci.yml.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Lint
        run: golangci-lint run ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      # A short run of each fuzz target: it replays the seed corpus and tries new
      # inputs for a few seconds. Longer runs are for a developer's machine. A
      # new interesting input is minimised for at most 5s (the default is 60s,
      # during which the run shows no progress), and each step is given a
      # time limit, so that a stall is a failure with a name, not a long wait.
      - name: Fuzz
        run: |
          set -e
          for t in FuzzSplitPath FuzzValidRepoAndRef FuzzRetryAfterOf FuzzManifestType; do
            printf 'Fuzz target: %s\n' "$t"
            timeout 120 go test ./internal/proxy -run '^$' -fuzz "^${t}\$" -fuzztime 20s -fuzzminimizetime 5s
          done
          printf 'Fuzz target: FuzzParsePeers\n'
          timeout 120 go test ./internal/peer -run '^$' -fuzz '^FuzzParsePeers$' -fuzztime 20s -fuzzminimizetime 5s

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Reports only vulnerabilities in code this module can actually call.
      # govulncheck has no way to accept a known one, so the findings are read
      # from its JSON output: each is printed as an annotation, and the ones
      # listed in ACCEPTED (with the reason) do not fail the job.
      # Accepted on purpose: GO-2026-5064, -5338, -5622 and -6791 are about the CRI
      # plugin's checkpoint restore and import in containerd v1, which has no fixed
      # release (only containerd/v2 does). SIC uses containerd's client library to
      # read the content store and list images; it runs no CRI plugin and restores
      # no checkpoints, and govulncheck reaches the affected packages only through
      # their init functions. The containerd daemon on a node is a separate matter.
      # Remove an id from the list, or migrate to containerd/v2, to enforce it.
      - name: govulncheck
        env:
          ACCEPTED: "GO-2026-5064 GO-2026-5338 GO-2026-5622 GO-2026-6791"
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck -format json ./... > vuln.json
          failed=0
          # One line per called vulnerability: id, module, and the version that fixes it.
          jq -r 'select(.finding != null) | select(.finding.trace[0].function != null)
                 | "\(.finding.osv) \(.finding.trace[0].module) \(.finding.fixed_version // "no fix")"' vuln.json | sort -u > called.txt
          while read -r id module fixed; do
            if [[ " $ACCEPTED " == *" $id "* ]]; then
              echo "::warning title=govulncheck (accepted)::$id in $module (fixed in $fixed) https://pkg.go.dev/vuln/$id"
            else
              echo "::error title=govulncheck::$id in $module (fixed in $fixed) https://pkg.go.dev/vuln/$id"
              failed=1
            fi
          done < called.txt
          exit $failed
