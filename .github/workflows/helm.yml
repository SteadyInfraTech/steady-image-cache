name: Helm Chart CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "charts/**"
      - "test/helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "charts/**"
      - "test/helm/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint and test templating
        run: ./test/helm/test.sh

      - name: Validate rendered templates against Kubernetes schemas
        run: |
          mkdir -p /tmp/rendered
          helm template test-sic charts/steady-image-cache > /tmp/rendered/all.yaml
          for v in 1.28.0 1.31.0; do
            go run github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7 \
              -strict -summary -kubernetes-version "$v" \
              -skip "ServiceMonitor,PrometheusRule,Certificate" \
              /tmp/rendered/all.yaml
          done

  publish-chart:
    needs: [lint-and-test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        id: package
        run: |
          mkdir -p .cr-packages
          # If triggered by a release tag (e.g. v1.3.0), align chart version
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            helm package charts/steady-image-cache --version "$VERSION" --app-version "$VERSION" --destination .cr-packages
          else
            helm package charts/steady-image-cache --destination .cr-packages
          fi
          echo "pkg=$(ls .cr-packages/*.tgz | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Helm chart OCI package to GHCR
        run: |
          # GHCR requires lowercase registry paths
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "${{ steps.package.outputs.pkg }}" "oci://ghcr.io/${OWNER_LOWER}/charts"
