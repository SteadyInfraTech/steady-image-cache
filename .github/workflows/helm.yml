name: Helm Chart CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "charts/**"
      - "test/helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "charts/**"
      - "test/helm/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint and test templating
        run: ./test/helm/test.sh

      - name: Validate rendered templates against Kubernetes schemas
        run: |
          mkdir -p /tmp/rendered
          helm template test-sic charts/steady-image-cache > /tmp/rendered/all.yaml
          for v in 1.28.0 1.31.0; do
            go run github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7 \
              -strict -summary -kubernetes-version "$v" \
              -skip "ServiceMonitor,PrometheusRule,Certificate" \
              /tmp/rendered/all.yaml
          done

  publish-chart:
    needs: [lint-and-test]
    # Only a release tag publishes: a chart version is published once, never
    # overwritten by later builds of main.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Check that the chart names the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The release pull request sets the chart's application version and
          # image tags to the release (RELEASING.md); a chart published for a tag
          # that does not match would deploy another version.
          VERSION="${TAG#v}"
          grep -q "^appVersion: \"$VERSION\"$" charts/steady-image-cache/Chart.yaml \
            || { echo "Chart.yaml appVersion is not $VERSION" >&2; exit 1; }
          test "$(grep -c "tag: \"$TAG\"" charts/steady-image-cache/values.yaml)" = 2 \
            || { echo "values.yaml must name $TAG for both images" >&2; exit 1; }

      - name: Wait for the release image
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The same tag starts release.yml, which builds and pushes the image. The
          # chart is published only once that image exists, so it is never
          # available before what it deploys.
          IMAGE="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]'):$TAG"
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
              echo "$IMAGE is published"
              exit 0
            fi
            echo "waiting for $IMAGE ($i/60)"
            sleep 30
          done
          echo "$IMAGE was not published within 30 minutes" >&2
          exit 1

      - name: Package Helm chart
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .cr-packages
          # The chart version follows the release tag (v1.3.0 -> 1.3.0). The
          # application version stays what Chart.yaml declares: it names the image
          # the chart deploys by default, which a release changes in the same pull
          # request (see RELEASING.md).
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not a version" >&2
            exit 1
          fi
          helm package charts/steady-image-cache --version "$VERSION" --destination .cr-packages
          echo "pkg=$(ls .cr-packages/*.tgz | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push Helm chart OCI package to GHCR
        env:
          PKG: ${{ steps.package.outputs.pkg }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # GHCR requires lowercase registry paths
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          helm push "$PKG" "oci://ghcr.io/${OWNER_LOWER}/charts"
