name: End-to-end (kind)

# A real containerd and the sample DaemonSet: one node holds an image, another
# pulls it through SIC from the first. See test/e2e/run.sh for what it checks.
on:
  push:
    branches:
      - main
    paths: &paths
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "test/e2e/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Built from source rather than taken from the runner image, so the
      # version does not change under us.
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.27.0

      - name: Run the end-to-end test
        run: test/e2e/run.sh
