name: End-to-end (Helm chart on kind)

# A real containerd, cert-manager and the chart installed with `helm install`:
# init-node's files on the nodes, a pull through the mirror it configures, and a
# certificate renewal. See test/e2e/helm.sh for what it checks.
on:
  push:
    branches:
      - main
    paths: &paths
      - "charts/**"
      - "cmd/**"
      - "internal/**"
      - "test/e2e/helm.sh"
      - "test/e2e/kind-config.yaml"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/e2e-helm.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-helm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # Built from source rather than taken from the runner image, so the
      # version does not change under us.
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.27.0

      - name: Run the chart end-to-end test
        run: test/e2e/helm.sh
