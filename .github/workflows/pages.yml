name: GitHub Pages compatibility redirects

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate legacy documentation redirects
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate redirects and legacy 404 page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              "index.html": "https://steadyinfra.com/sic/",
              "architecture.html": "https://steadyinfra.com/sic/architecture",
              "getting-started.html": "https://steadyinfra.com/sic/getting-started",
              "operations.html": "https://steadyinfra.com/sic/operations",
          }
          root = Path("docs")
          for filename, target in expected.items():
              page = root / filename
              content = page.read_text(encoding="utf-8")
              required = (
                  f'http-equiv="refresh" content="0; url={target}"',
                  f'<link rel="canonical" href="{target}">',
                  f'href="{target}"',
              )
              missing = [marker for marker in required if marker not in content]
              if missing:
                  raise SystemExit(f"{page}: missing redirect metadata or destination link: {missing}")
          not_found = (root / "404.html").read_text(encoding="utf-8")
          if "https://steadyinfra.com/sic/" not in not_found:
              raise SystemExit("docs/404.html must link to the current SIC documentation")
          print(f"Validated {len(expected)} legacy redirects and the moved-documentation 404 page.")
          PY
      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy compatibility redirects to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
