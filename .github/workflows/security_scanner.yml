      - name: Run Cloudflare AI Security Analysis
        id: security_check
        run: |
          CHANGES_CONTENT=$(cat changes.txt)
          
          if [ -z "$CHANGES_CONTENT" ]; then
            echo "No code changes detected."
            exit 0
          fi

          echo "Sending diff payload to Cloudflare Workers AI..."
          
          URL="https://cloudflare.com{{ secrets.CF_ACCOUNT_ID }}/ai/v1/chat/completions"
          
          RESPONSE=$(curl -s -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "cf-aig-gateway-id: github-ci-security" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "model": "@cf/meta/llama-3.3-70b-instruct-fp8-fast",
            "messages": [
              {
                "role": "system",
                "content": "You are an uncompromising Automated DevSecOps security scanner. Analyze the provided code diff for critical anti-patterns, hardcoded API keys/secrets, disabled SSL checks, wide open CORS rules (allow_all), exposed test configurations, or open debug endpoints. Your output MUST be strictly formatted as a valid raw JSON object string containing two root properties: 'vulnerabilities_found' (boolean) and 'critical_issues' (an array of strings explaining each flag). If no issues exist, return false and an empty array. Do not include markdown code block wraps like \`\`\`json or any conversational introductory text around your JSON output."
              },
              {
                "role": "user",
                "content": $(echo "$CHANGES_CONTENT" | jq -R -s .)
              }
            ],
            "temperature": 0.1
          }
          EOF
          )

          # Debug helper to see exactly what Cloudflare replied with
          echo "Raw API Response: $RESPONSE"

          # 1. Extract content safely from the OpenAI array wrapper
          RAW_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$RAW_CONTENT" ] || [ "$RAW_CONTENT" = "null" ]; then
            echo "Error: Received empty or invalid response envelope from Cloudflare."
            echo "vulnerable=false" >> $GITHUB_OUTPUT
            echo "API structural failure" > issues_report.txt
            exit 1
          fi

          # 2. Strip away markdown wrappers if the model generated them anyway
          CLEAN_JSON=$(echo "$RAW_CONTENT" | sed -e 's/```json//g' -e 's/```//g' | tr -d '\n\r')

          # 3. Parse the valid clean JSON object parameters
          VULN_STATUS=$(echo "$CLEAN_JSON" | jq -r '.vulnerabilities_found // false')
          ISSUES_LIST=$(echo "$CLEAN_JSON" | jq -r '.critical_issues | join("\n- ") // "No details provided."')

          echo "vulnerable=$VULN_STATUS" >> $GITHUB_OUTPUT
          echo -e "$ISSUES_LIST" > issues_report.txt
