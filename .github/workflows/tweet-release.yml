name: Tweet New Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests-oauthlib

      - name: Send Tweet via X API v2
        env:
          CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWEET_TEXT: "🚀 New Release: steady-image-cache ${{ github.event.release.tag_name }} is live! Read the changelog here: ${{ github.event.release.html_url }} #k8s #DevOps"
        shell: python
        run: |
          import os
          import json
          from requests_oauthlib import OAuth1Session

          # Collect secrets from environment
          consumer_key = os.environ["CONSUMER_KEY"]
          consumer_secret = os.environ["CONSUMER_SECRET"]
          access_token = os.environ["ACCESS_TOKEN"]
          access_token_secret = os.environ["ACCESS_TOKEN_SECRET"]
          text = os.environ["TWEET_TEXT"]

          # Initialize the secure OAuth session
          oauth = OAuth1Session(
              client_key=consumer_key,
              client_secret=consumer_secret,
              resource_owner_key=access_token,
              resource_owner_secret=access_token_secret
          )

          # Send payload to the modern X API v2 endpoint
          url = "https://api.x.com/2/tweets"
          payload = {"text": text}
          
          response = oauth.post(url, json=payload)

          if not response.ok:
              raise Exception(f"X API Error ({response.status_code}): {response.text}")
          
          print("Tweet posted successfully!")
